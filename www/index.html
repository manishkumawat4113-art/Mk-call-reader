<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>MK Call Reader</title>

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <div class="app">

        <header>

            <div class="logo">
                📞 MK Call Reader
            </div>

            <div class="subtitle">
                Voice assistant for your Phone app
            </div>

        </header>


        <main>

            <section class="card">

                <div class="icon">
                    🔊
                </div>

                <h2>
                    Call Name Reader
                </h2>

                <p id="status">
                    Checking service...
                </p>

                <button
                    id="enableBtn">

                    Enable Reader

                </button>

            </section>


            <section class="card">

                <h3>
                    Voice
                </h3>

                <label class="switch-row">

                    <span>
                        Speak contact name
                    </span>

                    <input
                        type="checkbox"
                        id="voiceSwitch"
                        checked>

                </label>

            </section>


            <section class="card">

                <h3>
                    Test
                </h3>

                <button
                    id="testBtn"
                    class="secondary">

                    🔊 Test Voice

                </button>

            </section>


            <section class="info">

                <h3>
                    How it works
                </h3>

                <p>
                    Open your normal Phone app.
                    When a number/contact screen is
                    detected, MK Call Reader can read
                    the displayed number and speak the
                    saved contact name.
                </p>

            </section>

        </main>

    </div>


    <script src="script.js"></script>

</body>

</html>
